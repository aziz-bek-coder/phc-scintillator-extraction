name: compute

# Heavy computations for this project only (validation, benchmarks, sweeps, figures).
# Started by hand from a terminal:
#   gh workflow run compute.yml -f job=benchmark -f config=configs/benchmark.json
#   gh run watch <run-id>
#   gh run download <run-id> -D results/benchmark/<run-id>/
# A job is split into chunks (matrix, at most 6 in parallel, each under 5 h). Every
# chunk checkpoints; to resume an interrupted run pass its id as resume_run_id.
# No schedule trigger, and never pull_request_target.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job name, see JOBS in scripts/remote_job.py"
        required: true
        type: string
      config:
        description: "Config file, e.g. configs/benchmark.json"
        required: true
        type: string
      resume_run_id:
        description: "Optional: id of an earlier run whose chunk artifacts to resume from"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: plan
        env:
          JOB: ${{ inputs.job }}
          CONFIG: ${{ inputs.config }}
        run: python scripts/remote_job.py plan --job "$JOB" --config "$CONFIG" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch first)
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Fetch checkpoint to resume from
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME: ${{ inputs.resume_run_id }}
          JOB: ${{ inputs.job }}
          CHUNK: ${{ matrix.chunk }}
        run: |
          gh run download "$RESUME" -R "$GITHUB_REPOSITORY" -n "$JOB-chunk-$CHUNK" -D resume \
            || echo "no checkpoint for chunk $CHUNK in run $RESUME; starting fresh"
      - name: Run chunk
        env:
          JOB: ${{ inputs.job }}
          CONFIG: ${{ inputs.config }}
          CHUNK: ${{ matrix.chunk }}
          NCHUNKS: ${{ matrix.n_chunks }}
        run: >
          python scripts/remote_job.py run --job "$JOB" --config "$CONFIG"
          --chunk "$CHUNK" --n-chunks "$NCHUNKS" --out out --resume resume
          --deadline-min 270
      - name: Upload chunk (also on failure, so it can be resumed)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.job }}-chunk-${{ matrix.chunk }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

  merge:
    needs: [plan, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch first)
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.job }}-chunk-*
          path: chunks
      - name: Merge chunks
        env:
          JOB: ${{ inputs.job }}
          CONFIG: ${{ inputs.config }}
        run: python scripts/remote_job.py merge --job "$JOB" --config "$CONFIG" --in chunks --out final
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.job }}-result
          path: final/
          if-no-files-found: error
          retention-days: 90
